<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio de Histórias — conectando</title>
<style>
:root{--bg:#faf8fc;--fg:#221a2e;--muted:#5e5470;--accent:#5a2fa0}
@media (prefers-color-scheme:dark){:root{--bg:#17131d;--fg:#ece6f4;--muted:#a79cb8;--accent:#c4a6f2}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:0 16px}
main{max-width:30rem;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 8px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1 id="t">Conectando a conta do TikTok…</h1>
  <p id="m">Voltando para o Estúdio de Histórias no seu computador.</p>
</main>
<script>
// O TikTok devolve ?code=...&state=... aqui. A página repassa para o app local (porta 8790),
// que troca o código pelo token. Nada é guardado nesta página.
(function () {
  var q = location.search;
  var p = new URLSearchParams(q);
  if (p.get("error")) {
    document.getElementById("t").textContent = "A conexão não foi autorizada.";
    document.getElementById("m").textContent = "Feche esta aba e tente de novo pelo app.";
    return;
  }
  if (!p.get("code")) {
    document.getElementById("t").textContent = "Nenhum código recebido.";
    document.getElementById("m").textContent = "Abra o login do TikTok pelo app do Estúdio de Histórias.";
    return;
  }
  location.replace("http://localhost:8790/tiktok/callback" + q);
})();
</script>
</body>
</html>
